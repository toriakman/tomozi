<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f1e8">
<title>{% block title %}Apple Tasting{% endblock %}</title>
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
<main class="shell">
<a class="brand" href="{{url_for('home')}}" aria-label="Apple Tasting home">
<svg class="brand-icon" viewBox="0 0 40 46" fill="none" aria-hidden="true"><path d="M20 13c-4-5-13-4-16 3-4 10 3 25 9 26 3 1 5-2 7-2s4 3 7 2c6-1 13-16 9-26-3-7-12-8-16-3Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M20 12c0-5-2-8-4-10m4 6c1-5 5-7 10-6-1 5-5 7-10 6Z" stroke="#344d3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span><span class="brand-name">Apple Tasting</span><span class="brand-tagline">Explore · Taste · Compare</span></span>
</a>
{% block body %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
